<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}S. Karuppasamy | Data Analytics Fresher{% endblock %}</title>
    <meta name="description" content="Portfolio of S. Karuppasamy, B.Sc. Computer Science graduate seeking Data Analyst and Data Analytics Intern roles.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
        <div class="container">
            <a class="navbar-brand logo" href="/">Karuppasamy.</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link {% if active=='home' %}active{% endif %}" href="/">Profile</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle {% if active=='about' %}active{% endif %}" href="/about" role="button">About</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/about#education"><i class="fa-solid fa-graduation-cap me-2"></i>Education</a></li>
                            <li><a class="dropdown-item" href="/about#skills"><i class="fa-solid fa-code me-2"></i>Skills</a></li>
                            <li><a class="dropdown-item" href="/about#learning"><i class="fa-solid fa-certificate me-2"></i>Learning</a></li>
                            <li><a class="dropdown-item" href="/about#strengths"><i class="fa-solid fa-bolt me-2"></i>Strengths</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link {% if active=='projects' %}active{% endif %}" href="/projects">Projects</a></li>
                    <li class="nav-item"><a class="nav-link {% if active=='contact' %}active{% endif %}" href="/contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer class="site-footer text-center">
        <p class="mb-0">&copy; 2026 S. Karuppasamy &middot; Built with Flask</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // fade-in on scroll
        const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }), {threshold: .12});
        document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    </script>
</body>
</html>
